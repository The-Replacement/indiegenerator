kind: station

# The blend. The lane is drawn inside compose(), which is the only place
# randomness is allowed to exist.
lane_weights:
  - {lane: motorik, weight: 30}
  - {lane: kosmische, weight: 25}
  - {lane: ambient, weight: 20}
  - {lane: dub-electronic, weight: 15}
  - {lane: indie-noise, weight: 10}

# THE THREE FORMS of a release. BRIEF 15: a batch is not twenty tracks of
# the same length - about 60% full tracks, 25% longform, 15% interludes.
# The forms are the station's release policy, so they are the same for
# every lane.
forms:
  - {form: full, weight: 60, duration_range_seconds: [360, 480]}
  - {form: longform, weight: 25, duration_range_seconds: [600, 900]}
  - {form: interlude, weight: 15, duration_range_seconds: [45, 120]}

# Three to seven notes, one cell, transformed per track but recognisable.
motif_bank:
  - [0, 3, 5, 7]
  - [0, 2, 3, 7]
  - [0, 2, 5, 7, 9]
  - [0, 4, 7, 11]
  - [0, 3, 7, 10]
  - [0, 5, 7, 10]

# The cell's own shape, in beats. The motif is longer than it looks: the
# last note of the phrase is held.
motif_rhythm: [1, 1, 2, 1]

title_words:
  - Low
  - Tide
  - Glass
  - Harbour
  - Hollow
  - Signal
  - Quiet
  - Circuit
  - Paper
  - Salt
  - Ember
  - Drift
  - North
  - Compass
  - Slow
  - Weather
  - Pale
  - Lantern
  - Iron
  - Meadow

# THE SECTION GRAPH. A track is a walk over this: the walk starts at the
# intro, follows the declared successors, and ends at the outro. The
# density and the level are the tension curve, and no two sections in a row
# may be the same arrangement.
section_graph:
  - {function: intro, next: [build, outro], density: 20, level_millibels: -1200, bars: 8, reprise_of: "", transform: identity, texture: sparse}
  - {function: build, next: [plateau, break, outro], density: 55, level_millibels: -600, bars: 16, reprise_of: "", transform: identity, texture: open}
  - {function: plateau, next: [peak, break, return, outro], density: 80, level_millibels: -500, bars: 16, reprise_of: "", transform: identity, texture: full}
  - {function: peak, next: [break, return], density: 95, level_millibels: -350, bars: 8, reprise_of: "", transform: identity, texture: dense}
  - {function: break, next: [drift, return, plateau, outro], density: 30, level_millibels: -1000, bars: 8, reprise_of: "", transform: identity, texture: hollow}
  - {function: drift, next: [return, plateau, outro], density: 45, level_millibels: -800, bars: 8, reprise_of: "", transform: identity, texture: drifting}
  - {function: return, next: [outro, plateau], density: 70, level_millibels: -450, bars: 8, reprise_of: build, transform: transpose, texture: returning}
  - {function: outro, next: [], density: 25, level_millibels: -1400, bars: 8, reprise_of: "", transform: identity, texture: fading}

# THE DIRECTOR. It draws a transformation every 8 to 32 bars in a pulsed
# lane and every 60 to 180 seconds in a lane with no pulse, and applies it
# to the running plan. The draw is compose()'s; the application is
# director()'s, and it is a pure function over the plan.
director:
  bars_min: 8
  bars_max: 16
  seconds_min: 60
  seconds_max: 120
  strategies:
    - {strategy: transpose_up_fourth, detail: transpose the sustained material up a fourth, parameter_min: 5, parameter_max: 5, applies_to: [pad, drone], crossfade_frames: 11025, span_bars: 0}
    - {strategy: transpose_motif, detail: transpose the motif, parameter_min: -5, parameter_max: 5, applies_to: [motif], crossfade_frames: 0, span_bars: 0}
    - {strategy: invert_motif, detail: invert the motif around the harmonic centre, parameter_min: 0, parameter_max: 0, applies_to: [motif], crossfade_frames: 0, span_bars: 0}
    - {strategy: retrograde_motif, detail: play the motif backwards, parameter_min: 0, parameter_max: 0, applies_to: [motif], crossfade_frames: 0, span_bars: 0}
    - {strategy: drop_drums, detail: take the drums out for a while, parameter_min: 0, parameter_max: 0, applies_to: [kick, snare, hat], crossfade_frames: 0, span_bars: 8}
    - {strategy: drop_kick, detail: take the kick out for a while, parameter_min: 0, parameter_max: 0, applies_to: [kick], crossfade_frames: 0, span_bars: 8}
    - {strategy: half_time, detail: halve the rhythm for a while, parameter_min: 0, parameter_max: 0, applies_to: [kick, snare, hat], crossfade_frames: 0, span_bars: 8}
    - {strategy: drop_bass, detail: take the bass out for a while, parameter_min: 0, parameter_max: 0, applies_to: [bass], crossfade_frames: 0, span_bars: 8}
    - {strategy: solo_texture, detail: leave the texture alone for a while, parameter_min: 0, parameter_max: 0, applies_to: [kick, snare, hat, bass], crossfade_frames: 0, span_bars: 8}
    - {strategy: swap_delay_to_triplets, detail: swap the delay to triplets, parameter_min: 0, parameter_max: 0, applies_to: [], crossfade_frames: 0, span_bars: 0}
    - {strategy: reharmonize_relative, detail: move the harmonic centre to the relative mode, parameter_min: 0, parameter_max: 0, applies_to: [], crossfade_frames: 0, span_bars: 0}

# The station's signature: the KS guitar is always heard through a dotted
# eighth delay. The ratio is resolved to an integer frame count at compose
# time, so the renderer never sees the tempo.
delay:
  delay_ratio: {numerator: 3, denominator: 4}
  feedback: {numerator: 55, denominator: 100}
  damping: {numerator: 30, denominator: 100}
  send_millibels: 0

fade_in_frames: 13230
fade_out_frames: 22050
section_crossfade_frames: 2205

# The master. The loudness target is the delivered integrated loudness in
# thousandths of a LU (-16 LUFS) and the ceiling is the true peak in
# millibels. The ceiling is four decibels below the gate's -1.5 dBTP
# limit, and the reason is the radio: it re-encodes to MP3 128, and the
# encoder overshoots by up to two decibels on a sharp transient (measured
# on the ten-track batch: -0.5 dB on most of them and +2.07 dB on the
# indie-noise lane's plucks). A master delivered at -1.8 dBFS clips in the
# radio's own encoder, and the codec gate refuses the file. The headroom
# is the difference between a track that plays and a track that clicks.
target_lufs_millibels: -16000
ceiling_millibels: -400
tuning_system: 1

dither_lsb: 1
track_number: 1
format_version: 1
