kind: lane
lane: indie-noise
alias: Tin Roof
album: Loose Ends
# The filename token: the output regex forbids hyphens.
file_token: indienoise

tempo_range_bpm: [90, 135]
meter: [4, 4]

# The lane's scale. The fundamental is drawn from here.
scale_midi: [38, 40, 42, 43, 45, 47, 50, 52, 54, 55, 57, 59, 62, 64, 66, 67]

# T16: the harmonic centre moves between these, at the section boundaries.
mode_pool: [dorian, phrygian]

# The lane has a pulse, so the sections are measured in bars.
pulse: bars

# c26: the noise is freer, the onsets drift furthest.
swing_permille: 300
melodic_jitter_frames: 45

# The timbre this lane expects for each kind of section, in hertz.
# Measured on real renders of this lane (BRIEF 5: measured, then tuned),
# and asserted by gate 6. The numbers are the medians of twenty renders
# of the lane, one per seed.
timbre: {break: 7318, build: 7905, drift: 7229, intro: 7378, outro: 7376, peak: 7506, plateau: 7736, return: 7983}

fx_sends:
  - {name: biquad_lowpass, send_millibels: 0, cutoff_hz: 16000, q_num: 1, q_den: 1}

techniques:
  # T7: the 1/f control signals.
  - kind: pink
    velocity_depth_millibels: 700
    micro_timing_frames: 14
    pan_drift_permille: 260

  # T13: the guitar clusters. The deja-vu sequencer picks the notes, so the
  # clusters emerge and dissolve instead of being looped.
  - kind: deja_vu
    step_beats: 1
    buffer_size: 24
    min_density: 20
    replay_min_permille: 250
    replay_max_permille: 900
    bias: 0
    spread: 14
    note_frames: 13000
    feedback_num: 999
    feedback_den: 1000
    brightness: {numerator: 7, denominator: 10}
    pluck_position_permille: 180
    detune_cents: 0

  # T6: the noise wall. It crests in the plateau and cuts to near silence
  # with the outro: the dynamics are the point of this lane. The wall
  # comes in with the build (a density of 55) and not with the dense
  # sections alone, so a walk that never reaches one still has a wall.
  - kind: hat
    pattern:
      steps_per_bar: 16
      euclid_k: 16
      euclid_n: 16
      rotation: 0
      condition: always
      condition_period: 1
      min_density: 55
      ghost_permille: 340
      velocity_millibels: -1200
    cutoff_hz: 5200
    decay_frames: 3400

section_count_range: [4, 6]
# The durations this lane may be rendered at: the full tracks, the
# longforms and the interludes of BRIEF 15's batch.
duration_range_seconds: [45, 900]
