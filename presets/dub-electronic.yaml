kind: lane
lane: dub-electronic
alias: Silt
album: Chamber Echoes
# The filename token: the output regex forbids hyphens.
file_token: dubelectronic

tempo_range_bpm: [100, 130]
meter: [4, 4]

# The lane's scale. The fundamental is drawn from here.
scale_midi: [38, 39, 41, 43, 45, 46, 48, 50, 51, 53, 55, 56, 58, 60, 62, 63]

# T16: the harmonic centre moves between these, at the section boundaries.
mode_pool: [phrygian, aeolian]

# The lane has a pulse, so the sections are measured in bars.
pulse: bars

# c26: a loose backbeat and drifting stabs.
swing_permille: 500
melodic_jitter_frames: 25

# c30: the stabs drive hard and the kit snaps.
drive_permille: 350
snap_permille: 350

# c31: the masking duck - see motorik.yaml. This lane already has the kick
# sidechain; the duck carves the band the bass itself occupies.
duck: {depth_millibels: -6000, release_frames: 8820}

# The timbre this lane expects for each kind of section, in hertz.
# Measured on real renders of this lane (BRIEF 5: measured, then tuned),
# and asserted by gate 6.
timbre: {break: 1509, build: 5014, drift: 1855, intro: 2391, outro: 2080, peak: 3298, plateau: 5106, return: 3224}

fx_sends:
  - {name: biquad_lowpass, send_millibels: 0, cutoff_hz: 9000, q_num: 1, q_den: 1}

techniques:
  # T7: the 1/f control signals of the lane.
  - kind: pink
    velocity_depth_millibels: 4500
    micro_timing_frames: 9
    pan_drift_permille: 120

  # T6: the drums. The kick on the quarters, the snare on two and four,
  # the hats on the offbeats, and the sub under it all.
  - kind: kick
    pattern:
      steps_per_bar: 16
      euclid_k: 4
      euclid_n: 16
      rotation: 0
      condition: always
      condition_period: 1
      min_density: 0
      ghost_permille: 0
      velocity_millibels: 0
    body_hz: 100
    drop_hz: 42
    drop_frames: 800
    decay_frames: 12000
  - kind: snare
    pattern:
      steps_per_bar: 8
      euclid_k: 2
      euclid_n: 8
      rotation: 4
      condition: always
      condition_period: 1
      min_density: 40
      ghost_permille: 150
      velocity_millibels: -3000
    body_hz: 200
    body_decay_frames: 3000
    noise_decay_frames: 8000
  - kind: hat
    pattern:
      steps_per_bar: 8
      euclid_k: 4
      euclid_n: 8
      rotation: 1
      condition: always
      condition_period: 1
      min_density: 70
      ghost_permille: 200
      velocity_millibels: -7000
    cutoff_hz: 8200
    decay_frames: 2200
    # c31: BRIEF 6's codec rule - keep the essential content below 14 kHz.
    lowpass_hz: 14000
  # The minor-9 stabs through the chain. The deja-vu sequencer picks the
  # notes, so the stabs emerge instead of repeating.
  - kind: deja_vu
    step_beats: 2
    buffer_size: 32
    min_density: 40
    replay_min_permille: 200
    replay_max_permille: 900
    bias: 13
    spread: 8
    note_frames: 7000
    feedback_num: 998
    feedback_den: 1000
    brightness: {numerator: 4, denominator: 10}
    pluck_position_permille: 300
    detune_cents: 0

  - kind: bass
    pattern:
      steps_per_bar: 8
      euclid_k: 8
      euclid_n: 8
      rotation: 0
      condition: always
      condition_period: 1
      min_density: 40
      ghost_permille: 0
      velocity_millibels: -2000
    cutoff_hz: 380
    decay_frames: 6500
    octave_jump_permille: 200
    fifth_permille: 0

  # T10: the dub chain. The stabs are bit-reduced, bandpassed at 450 Hz
  # with a slow 1/f drift on the cutoff, and everything but the kick is
  # ducked by the kick.
  - kind: dub_chain
    bit_depth: 8
    bandpass_hz: 450
    bandpass_q_num: 2
    bandpass_q_den: 1
    drift_depth_hz: 120
    send_millibels: -2000
    sidechain_depth_millibels: -9000
    sidechain_release_frames: 12000
    min_density: 40

section_count_range: [4, 6]
# The durations this lane may be rendered at: the full tracks, the
# longforms and the interludes of BRIEF 15's batch.
duration_range_seconds: [45, 900]
