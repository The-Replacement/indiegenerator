kind: lane
lane: ambient
alias: Exposición Larga
album: Habitaciones en Media Luz
# The filename token: the output regex forbids hyphens.
file_token: ambient

tempo_range_bpm: [112, 124]
meter: [4, 4]

# D dorian, two octaves. The fundamental is drawn from here.
scale_midi: [38, 40, 41, 43, 45, 47, 48, 50, 52, 53, 55, 57, 59, 60, 62, 64]

# The lane has no pulse, so the sections are measured in seconds and the
# Director fires every 60 to 180 of them.
mode_pool: [dorian, aeolian]
pulse: seconds

# c26: the ambient has no pulse, so swing is a no-op; the plucks still drift.
swing_permille: 0
melodic_jitter_frames: 30

# c30: a whisper of harmonics on the drone and the plucks.
drive_permille: 150

# The timbre this lane expects for each kind of section, in hertz.
# FLAT BY DECLARATION (c27-C), not by omission: this lane predicts no
# timbre arc. Its centroid is set by the drone bed and the pluck stream,
# not by the section's function, and the delivered per-section centroid
# moves with the track's duration instead. Measured on the raw mix the
# gates see, four seeds, 45-900 s (15 cells): no function owns the
# brightest centroid - the outro is brightest in 8 cells, the intro in 5,
# the plateau and the build in one each - and the same function drifts with
# duration: at seed 1042 the intro reads 714 Hz at 90 s, 599 at 240 s and
# 552 at 480 s, and the plateau is the dimmest section at 90 s but the
# brightest at 900 s. At 45 s the outro is the DARKEST in two of three
# seeds. A per-function table fitted at one duration does not hold at
# another (the 90 s 1042 table correlates -0.37 / -0.28 / +0.35 at 45 s),
# which is the duration-dependent declaration c32 documented for
# kosmische. So every function declares the same centroid and gate 6
# measures this lane's VARIANCE (relative sigma <= 0.25), not a curve.
# 560 Hz is the measured median of the delivered per-section centroid over
# those 15 cells (range 412-861); it is the scale of that check, not a
# claim that a section sits there.
timbre: {intro: 560, build: 560, plateau: 560, peak: 560, break: 560, drift: 560, return: 560, outro: 560}

fx_sends:
  - {name: biquad_lowpass, send_millibels: 0, cutoff_hz: 5000, q_num: 1, q_den: 1}

techniques:
  # T1: poly-period loops. The periods are drawn without replacement, so the
  # superpattern never repeats. The chord is the lane's interval list, and at
  # most one pair of voices may form a minor second.
  - kind: poly_period
    voice_count: {min: 4, max: 6}
    period_seconds_range: {min: 15, max: 90}
    on_fraction_permille: {min: 140, max: 280}
    attack_seconds_range: {min: 2, max: 10}
    chord_intervals: [0, 3, 5, 7, 10]
    min_density: 0
    partial_ratios:
      - {numerator: 1, denominator: 1}
      - {numerator: 2, denominator: 1}

  # T11: a spectral drone stack. The partials are exact just ratios and each
  # one drifts on its own 1/f signal.
  - kind: drone
    partial_count: {min: 6, max: 10}
    detune_cents_range: {min: -15, max: 15}
    detune_lfo_rate: {numerator: 1, denominator: 10}
    detune_lfo_depth_cents: 12
    amplitude_lfo_rate: {numerator: 1, denominator: 13}
    amplitude_lfo_depth_millibels: 4000
    min_density: 0
    ratios:
      - {numerator: 1, denominator: 1}
      - {numerator: 9, denominator: 8}
      - {numerator: 5, denominator: 4}
      - {numerator: 4, denominator: 3}
      - {numerator: 3, denominator: 2}

  # T13: the station's signature timbre.
  - kind: pluck
    count: {min: 3, max: 6}
    min_density: 0
    feedback_num_min: 996
    feedback_num_max: 999
    feedback_den: 1000
    detune_cents: 7
    brightness: {numerator: 1, denominator: 2}
    pluck_position_permille: 300
    duration_seconds: {min: 3, max: 6}
    spacing_seconds: {min: 4, max: 12}

section_count_range: [3, 4]
# The durations this lane may be rendered at: the full tracks, the
# longforms and the interludes of BRIEF 15's batch.
duration_range_seconds: [45, 900]
attack_frames: 13230
release_frames: 13230

# A short Schroeder reverb: eight parallel combs into four series allpasses.
reverb:
  comb_delays_frames: [1557, 1617, 1491, 1422, 1277, 1356, 1397, 1129]
  comb_feedback: {numerator: 84, denominator: 100}
  damping: {numerator: 2, denominator: 100}
  allpass_delays_frames: [556, 441, 341, 225]
  allpass_feedback: {numerator: 5, denominator: 10}
  # Eight frames, not twenty-three: the spread is the decorrelation
  # between the two channels, and at the low end it is what takes the bass
  # out of the mono fold-down (measured: -1.78 dB at twenty-three frames,
  # -0.32 dB at eight). Eight frames is a fifth of a millisecond, and the
  # width comes from the combs, not from it.
  stereo_spread_frames: 8
  send_millibels: -6000
