name: gate

on:
  push:
    branches: [master]
  pull_request:

# A push to a branch that already has a pull request open would otherwise run
# the same tree twice. The newer run is the one that matters.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Pinned, not -latest: the label migrates to Ubuntu 26 from 2026-10-19 and
    # the python-versions manifest has to carry 3.15 for the new image first.
    # A gate that moves under you is a gate whose red means nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # pyproject pins >=3.15,<3.16.
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Six tests compare the loudness meter and the codec against ffmpeg and
      # skip without it. Without this step CI is green while never running the
      # one test that checks the meter against an independent implementation.
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install
        run: pip install -e '.[dev]'

      - name: Audit dependencies
        run: pip install pip-audit && pip-audit

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      # The golden renders are the equivalence proof for the planner and the
      # audio path. They are not excluded from this run: a suite that skips
      # them would still be green after an RNG reorder. The seed sweep has its
      # own job below and is minutes of rendering.
      - name: Test
        run: pytest -q -m "not sweep"

  sweep:
    # The bounded seed sweep: five lanes x three seeds through gates 4-7 and
    # 13. It is the job that would have caught c27's two-section ambient, and
    # it is separate so the default run stays fast.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Seed sweep
        run: pytest -q -m sweep
