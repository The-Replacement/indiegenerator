name: gate

on:
  push:
    branches: [master]
  pull_request:

# A push to a branch that already has a pull request open would otherwise run
# the same tree twice. The newer run is the one that matters.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # pyproject pins >=3.15,<3.16. The manifest has 3.15.1 for
          # ubuntu-24.04, so this resolves to a real release, not an rc.
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      # The golden renders are the equivalence proof for the planner and the
      # audio path. They are not excluded from this run: a suite that skips
      # them would still be green after an RNG reorder.
      - name: Test
        run: pytest -q
