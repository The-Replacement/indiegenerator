[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "indiegenerator"
version = "0.1.0"
description = "Batch, offline, deterministic music generator for a private internet radio."
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Juan Manuel Daza", email = "juanmanueldaza@gmail.com" }]
keywords = ["music", "generative", "dsp", "systems-music", "offline"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "soundfile==0.14.0",
  "pydantic==2.14.1",
  "typer==0.27.3",
  "PyYAML==6.0.3",
  "mutagen==1.48.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
]

[project.scripts]
indiegen = "indiegen.cli:main"

[project.urls]
Homepage = "https://github.com/The-Replacement/indiegenerator"

[tool.hatch.build.targets.wheel]
packages = ["src/indiegen"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "RET", "SIM", "C90"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design, call ffmpeg by name (S603/S607), and write the
# attack payloads a security test needs (S106/S108). None of that is
# production code, and the production copies of those rules stay on.
"tests/*" = ["N802", "S101", "S106", "S108", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.15"
files = ["src"]

# scipy, soundfile and PyYAML ship no py.typed marker.
[[tool.mypy.overrides]]
module = ["scipy.*", "soundfile", "yaml"]
ignore_missing_imports = true

# mutagen ships a marker but leaves its functions unannotated.
[[tool.mypy.overrides]]
module = ["mutagen.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running lane renders checked against committed golden hashes",
]
